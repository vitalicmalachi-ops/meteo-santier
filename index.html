<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Weather</title>
<meta name="description" content="7-day site forecast from 13 weather models, with the work you can do each day.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meteo Șantier">
<meta name="theme-color" content="#1D2120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: o tablă de șantier — bandă de antet cu linia de avertizare, apoi rândurile zilelor ca o listă de pontaj, detaliile se deschid sub fiecare zi. */
:root{
  --bg:#ECEDE8; --surface:#F8F8F4; --ink:#1D2120; --muted:#5C6460; --line:#CDD1C9;
  --band:#1D2120; --band-ink:#F1F2EC; --band-muted:#A9B0AB;
  --accent:#F2B300; --sun:#B07800; --rain:#1F63B5; --snow:#5F7FA6;
  --ok:#1E7D47; --warn:#A96A00; --stop:#BC3A2B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141716; --surface:#1C201F; --ink:#E8EBE5; --muted:#9BA39F; --line:#2F3533;
  --band:#0C0E0D; --band-ink:#EEF0EA; --band-muted:#8E9692;
  --sun:#F2B300; --rain:#69A5E6; --snow:#A7B9CE; --ok:#5DBB84; --warn:#E2A84B; --stop:#E8705F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1C201F; --ink:#E8EBE5; --muted:#9BA39F; --line:#2F3533;
  --band:#0C0E0D; --band-ink:#EEF0EA; --band-muted:#8E9692;
  --sun:#F2B300; --rain:#69A5E6; --snow:#A7B9CE; --ok:#5DBB84; --warn:#E2A84B; --stop:#E8705F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Antet */
header{position:relative;overflow:hidden;isolation:isolate;background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px);transition:background-color .8s}
header>canvas.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
header[data-sky=rain],header[data-sky=storm],header[data-sky=drizzle]{background:#172029}
header[data-sky=fog]{background:#222726}
header .wrap{padding-block:18px 16px;display:grid;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font:800 13px/1 var(--f-display);font-stretch:110%;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand span{font:12px var(--f-mono);color:var(--band-muted)}
.place{min-width:0}
.place h1{margin:0;font:750 clamp(28px,8vw,40px)/1.02 var(--f-display);font-stretch:72%;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.place .coords{font:12px var(--f-mono);color:var(--band-muted);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--band-ink) 28%,transparent);background:transparent;color:var(--band-ink);padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.btn:hover{background:color-mix(in srgb,var(--band-ink) 10%,transparent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1D2120}
.btn svg{width:16px;height:16px;flex:none}
.hazard{height:7px;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,var(--band) 9px 18px);background-size:25.46px 7px}
body.is-loading .hazard{animation:hazard .9s linear infinite}
@keyframes hazard{to{background-position:25.46px 0}}
@media (prefers-reduced-motion:reduce){body.is-loading .hazard{animation:none}}

.search{display:grid;gap:8px}
.search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--band-ink) 30%,transparent);background:color-mix(in srgb,var(--band-ink) 8%,transparent);color:var(--band-ink)}
.search input::placeholder{color:var(--band-muted)}
.results{display:grid;gap:2px}
.results button{text-align:left;background:transparent;border:0;padding:8px 10px;border-radius:8px;color:var(--band-ink);cursor:pointer}
.results button:hover{background:color-mix(in srgb,var(--band-ink) 10%,transparent)}
.results small{color:var(--band-muted)}
.saved{display:flex;gap:6px;flex-wrap:wrap}
.saved button{border:0;background:color-mix(in srgb,var(--band-ink) 12%,transparent);color:var(--band-ink);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.saved button[aria-current="true"]{background:var(--accent);color:#1D2120}
.note{font-size:13px;color:var(--band-muted)}

main .wrap{padding-block:18px 28px;display:grid;gap:18px}
.status{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;transform:translateY(-1px)}
.status.loading .dot{background:var(--accent);animation:pulse 1s infinite alternate}
.status.err{color:var(--stop)}
.status.err .dot{background:var(--stop)}
@keyframes pulse{to{opacity:.3}}
.err-box{border:1px solid var(--stop);border-radius:10px;padding:12px 14px;color:var(--stop);display:grid;gap:8px;justify-items:start}
.err-box button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 12px;cursor:pointer}

/* Rezumat */
.summary{display:grid;gap:8px}
.summary h2,.section-h{margin:0;font:700 12px/1 var(--f-display);font-stretch:110%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sum-row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.sum-row:first-of-type{border-top:0}
.sum-row .k{font-weight:600;display:flex;align-items:center;gap:8px}
.sum-row .k i{width:10px;height:10px;border-radius:2px;flex:none}
.sum-row .v{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tag{font:500 13px var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 7px}

/* Zile */
.days{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day.today{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.day-head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:78px 30px 62px minmax(0,1fr) 18px;gap:10px;align-items:center;padding:12px 12px 8px;cursor:pointer}
.day-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.d-date b{display:block;font:750 19px/1.05 var(--f-display);font-stretch:80%}
.d-date span{font-size:13px;color:var(--muted)}
.d-glyph svg{width:30px;height:30px;display:block}
.d-temp{display:flex;flex-direction:column;line-height:1.1}
.d-temp .tmax{font:500 19px var(--f-mono)}
.d-temp .tmin{font:400 14px var(--f-mono);color:var(--muted)}
.d-rain{min-width:0;display:grid;gap:4px}
.votes{display:flex;flex-wrap:wrap;gap:2px}
.votes i{width:9px;height:14px;border-radius:2px;border:1px solid var(--line);background:transparent}
.votes i.r{background:var(--rain);border-color:var(--rain)}
.votes i.s{background:var(--snow);border-color:var(--snow)}
.votes-lbl{font-size:13px;line-height:1.25;color:var(--muted)}
.votes-lbl b{color:var(--ink);font-weight:600}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.day[data-open="true"] .chev{transform:rotate(180deg)}
.d-meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--ink) 6%,transparent);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.flag{font-weight:600}
.chip.flag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.stop{color:var(--stop);background:color-mix(in srgb,var(--stop) 12%,transparent)}

.d-detail{border-top:1px dashed var(--line);padding:12px;display:grid;gap:14px}
.blocks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.blk{display:grid;gap:3px;justify-items:center;text-align:center;padding:6px 2px;border-radius:8px}
.blk.now{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.blk .h{font:500 12px var(--f-mono);color:var(--muted)}
.blk .bar{width:14px;height:40px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);position:relative;overflow:hidden}
.blk .bar span{position:absolute;left:0;right:0;bottom:0;background:var(--rain)}
.blk .bar span.s{background:var(--snow)}
.blk .pv{font:500 12px var(--f-mono)}
.blk .t{font:500 13px var(--f-mono)}
.blk .g{font:400 11px var(--f-mono);color:var(--muted)}
.blk.na{opacity:.4}
.legend{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:440px;font-size:13px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
td.wet{color:var(--rain);font-weight:600}
td small{display:block;color:var(--muted);font-family:var(--f-body);font-size:11.5px}

/* Calendar lucrări */
.planner{display:grid;gap:8px}
.planner h2{margin:0;font:700 12px/1 var(--f-display);font-stretch:110%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px}
table.pl{min-width:0;width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px;font-size:13px}
table.pl th,table.pl td{padding:0;border:0;text-align:center;white-space:normal}
table.pl thead th{font:500 11.5px/1.15 var(--f-mono);color:var(--muted);padding-bottom:4px}
table.pl tbody th{text-align:left;font:600 13px var(--f-body);color:var(--ink);width:74px;padding-left:4px}
table.pl thead th:first-child{width:74px}
.cell{display:grid;place-items:center;width:100%;height:30px;border:0;border-radius:6px;font:700 14px var(--f-mono);cursor:pointer;padding:0}
.cell.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.cell.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,transparent)}
.cell.stop{color:#fff;background:var(--stop)}
.cell.na{color:var(--muted);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.pl-legend span{display:inline-flex;align-items:center;gap:6px}
.pl-legend .cell{width:22px;height:20px;font-size:12px;cursor:default}

.works{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.works li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.3}
.works .cell{height:26px;cursor:default}
.works small{color:var(--muted);font-size:13px}
.soil-line{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.soil-line svg{width:16px;height:16px;color:var(--snow);flex:none}
.soil-line b{color:var(--ink)}

.work-pick{display:flex;flex-wrap:wrap;gap:6px 14px}
.work-pick label{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.work-pick input{accent-color:var(--ink);width:16px;height:16px}

.skel{height:84px;border-radius:12px;background:linear-gradient(90deg,var(--surface),color-mix(in srgb,var(--ink) 5%,var(--surface)),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

footer .wrap{padding-block:6px 32px;display:grid;gap:14px;font-size:14px;color:var(--muted)}
footer label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.models{display:flex;flex-wrap:wrap;gap:6px}
.models span{font-size:12.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.models span.off{opacity:.45;text-decoration:line-through}
footer p{margin:0;max-width:65ch}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}


/* Starea de acum, lângă numele locului */
.place-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.place-row .place{flex:1}
.now{flex:none;text-align:right;display:grid;gap:4px;justify-items:end}
.now-t{font:500 clamp(34px,10vw,46px)/.95 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--band-ink);letter-spacing:-.02em}
.now-h{font-size:13px;line-height:1.3;color:var(--band-muted)}

/* Fără locație */
.noloc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:start}
.noloc h2{margin:0;font:750 22px/1.1 var(--f-display);font-stretch:85%}
.noloc p{margin:0;color:var(--muted)}
.noloc button{background:var(--accent);color:#1D2120;border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:40px}

/* Setări */
.settings{display:grid;gap:14px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.set-grid label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.set-grid label.wide{grid-column:1/-1}
.set-grid select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px}
details.limits{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
details.limits summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--ink)}
details.limits[open]{padding-bottom:14px}
details.limits p{margin:0 0 12px}
.lim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lim-grid fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:10px 0 0;display:grid;gap:8px;min-width:0}
.lim-grid legend{font-weight:600;color:var(--ink);padding:0;font-size:14px}
.lim-grid label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.lim-in{display:inline-flex;align-items:center;gap:6px}
.lim-in input{width:76px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px var(--f-mono);text-align:right}
.lim-in i{font-style:normal;font:12px var(--f-mono);color:var(--muted);width:34px}
button.reset{margin-top:12px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
#shareFallback input{width:100%;margin-top:4px;padding:6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit}
table.pl thead th.today{color:var(--ink);font-weight:700}


/* Oră cu oră */
.hours{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}
.hgrid{display:grid;grid-template-columns:repeat(24,34px);gap:3px;width:max-content;position:relative}
.hgrid svg.curve{position:absolute;left:0;top:0;pointer-events:none;color:var(--ink);overflow:visible}
.hc{display:grid;gap:3px;justify-items:center;text-align:center;padding:6px 0;border-radius:7px}
.hc.work{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.hc.now{outline:2px solid var(--ink);outline-offset:-2px}
.hc.na{opacity:.4}
.hc.past{opacity:.45}
.hc .h{font:500 12px var(--f-mono);color:var(--muted)}
.hc.work .h{color:var(--ink);font-weight:600}
.hc .bar{width:12px;height:40px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);position:relative;overflow:hidden}
.hc .bar span{position:absolute;left:0;right:0;bottom:0;background:var(--rain)}
.hc .bar span.s{background:var(--snow)}
.hc .bar span.dz{background:color-mix(in srgb,var(--rain) 30%,transparent)}
.hc .t{font:500 12.5px var(--f-mono)}
.hc .g{font:400 11px var(--f-mono);color:var(--muted)}
.set-grid input[type=time]{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-mono)}
.set-note{margin:0;font-size:13px;grid-column:1/-1}


/* Setări pliate: se deschid doar la cerere, închise la fiecare pornire */
details.set-box{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
details.set-box>summary{cursor:pointer;padding:14px 0;font:700 13px/1 var(--f-display);font-stretch:110%;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
details.set-box[open]{padding-bottom:14px;display:grid;gap:14px}
details.set-box[open]>summary{padding-bottom:0}
details.set-box details.limits{background:var(--bg)}


/* A doua săptămână, pliată ca setările */
details.models-box>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 0;-webkit-tap-highlight-color:transparent}
details.models-box>summary::-webkit-details-marker{display:none}
details.models-box .chev{width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details.models-box[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
button.chip{border:0;font-family:inherit;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:85vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgb(0 0 0 / .18);display:grid;gap:12px}
.sh-head{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center}
.sh-head .cell{height:34px;cursor:default}
.sh-head small{color:var(--muted)}
.sh-x{border:0;background:none;color:var(--muted);font-size:28px;line-height:1;width:40px;height:40px;cursor:pointer}
.sh-reason{margin:0;font-size:15px}
.sh-rep{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.sh-rep h3{margin:0;font:700 12px/1 var(--f-display);font-stretch:110%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sh-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-seg button,.sh-tags button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 8px;font:inherit;font-size:14px;cursor:pointer}
.sh-seg button[aria-checked="true"],.sh-tags button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.sh-tags{display:flex;flex-wrap:wrap;gap:6px}
.sh-tags button{padding:6px 10px;font-size:13px}
.sh-q{margin:0;font-size:13px;color:var(--muted)}
.sheet .btn{display:flex;justify-content:center;align-items:center;width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.sheet .btn.primary{background:var(--accent);border-color:var(--accent);color:#1D2120}
.sh-send:disabled{opacity:.45;cursor:default}
.sh-note,.sh-done{margin:0;font-size:12px;color:var(--muted)}
.sh-done{font-size:14px;color:var(--ink);border-top:1px dashed var(--line);padding-top:12px}
.accuracy{margin-bottom:12px}
.acc-box p{margin:0;font-size:14px}
.acc-box .acc-note{font-size:12px;color:var(--muted)}
.acc-box summary .num{color:var(--ok)}
.radar{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;margin-bottom:12px}
.radar.now{border-color:color-mix(in srgb,var(--rain) 55%,var(--line));background:color-mix(in srgb,var(--rain) 6%,var(--surface))}
.radar.soon{border-color:color-mix(in srgb,var(--rain) 35%,var(--line))}
.rd-map{width:120px;height:120px;border-radius:10px;display:block}
.rd-body{min-width:0;display:grid;gap:6px;text-align:left}
.rd-head{font-size:16px;line-height:1.25;font-weight:700}
.rd-body small{font-size:11px;color:var(--muted);line-height:1.3}
.rd-bars{display:flex;gap:3px;align-items:flex-end;height:30px}
.rd-bars i{flex:1;max-width:14px;height:calc(5px + var(--p) * 25px);border-radius:3px;background:color-mix(in srgb,var(--rain) 22%,transparent);transition:outline-color .2s;outline:2px solid transparent;outline-offset:1px}
.rd-bars i.wet{background:var(--rain)}
.rd-bars i.on{outline-color:var(--accent)}
.rd-axis{display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted);margin-top:-2px}
details.week2{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.week2>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px}
details.week2>summary::-webkit-details-marker{display:none}
details.week2>summary::before{content:"▸";color:var(--muted);margin-right:-4px;transition:transform .2s}
details.week2[open]>summary::before{transform:rotate(90deg)}
.w2-t{font:700 13px/1 var(--f-display);font-stretch:110%;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);flex:1}
.w2-r{font-size:13px;color:var(--muted)}
.w2-body{display:grid;gap:14px;padding:0 10px 12px}
.w2-note{margin:0;font-size:13px;color:var(--muted);padding:0 4px}
.w2-body .day{background:var(--bg)}
.w2-body .pl-wrap{background:var(--bg)}


/* Ceață */
.hc .fz{font:600 13px/1 var(--f-mono);color:var(--muted);height:14px}
.hc .fz.on{color:var(--ink)}
.chip.fogc{color:var(--ink);background:color-mix(in srgb,var(--muted) 18%,transparent)}

@media (max-width:420px){
  .day-head{grid-template-columns:66px 26px 52px minmax(0,1fr) 16px;gap:8px;padding:11px 10px 7px}
  .d-meta{padding:0 10px 11px}
  .d-date b{font-size:17px}
  .d-glyph svg{width:26px;height:26px}
  .d-temp .tmax{font-size:17px}
  .sum-row{grid-template-columns:1fr;gap:4px}
  .d-detail{padding:12px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><b data-i18n="brand">Site Weather</b><span id="updated"></span></div>
    <div class="place-row">
      <div class="place">
        <h1 id="placeName"></h1>
        <div class="coords" id="placeCoords"></div>
      </div>
      <div class="now" id="now" role="group" hidden>
        <div class="now-t" id="nowT"></div>
        <div class="now-h" id="nowH"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnLocate" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg><span data-i18n="btnLocate"></span></button>
      <button class="btn" id="btnSearch" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><span data-i18n="btnSearch"></span></button>
      <button class="btn" id="btnShare" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-i18n="btnShare"></span></button>
      <button class="btn" id="btnSave" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-i18n="btnSave"></span></button>
    </div>
    <div class="search" id="searchBox" hidden>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <div class="results" id="results"></div>
    </div>
    <div class="saved" id="saved"></div>
    <div class="note" id="shareFallback" hidden></div>
  </div>
  <div class="hazard" aria-hidden="true"></div>
</header>

<main>
  <div class="wrap">
    <div class="status loading" id="status"><span class="dot"></span><span id="statusText"></span></div>
    <section class="noloc" id="noLoc" hidden>
      <h2 data-i18n="noLocTitle"></h2>
      <p data-i18n="noLocText"></p>
      <button type="button" id="noLocBtn" data-i18n="noLocBtn"></button>
    </section>
    <div id="errBox"></div>
    <section class="radar" id="radar" hidden aria-live="polite"></section>
    <section class="summary" id="summary" hidden></section>
    <section class="planner" id="planner" hidden></section>
    <section class="days" id="days">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <section class="accuracy" id="accuracy" hidden></section>
    <section class="settings" id="settings"></section>
  </div>
</footer>

</body>
