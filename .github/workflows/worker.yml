# Publică proxy-ul radar pe Cloudflare Workers (planul gratuit). Are nevoie de două secrete în repository:
# CLOUDFLARE_API_TOKEN (șablonul „Edit Cloudflare Workers”) și CLOUDFLARE_ACCOUNT_ID.
# Jurnalul publicării (fără secrete) se salvează pe ramura worker-log.
name: Radar proxy
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publică
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/log
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Lipsește CLOUDFLARE_API_TOKEN" > /tmp/log/deploy.txt; exit 0; fi
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID}" > /tmp/log/deploy.txt
          cd worker
          npx --yes wrangler@4 whoami >> /tmp/log/deploy.txt 2>&1 || true
          npx --yes wrangler@4 deploy >> /tmp/log/deploy.txt 2>&1; echo "exit $?" >> /tmp/log/deploy.txt
      - name: Test
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/log/deploy.txt | head -1)
          echo "url: $URL" >> /tmp/log/deploy.txt
          [ -z "$URL" ] && exit 0
          sleep 15
          U=$(curl -s "https://api.meteogate.eu/eu-eumetnet-weather-radar/collections/observations/locations/0-20010-0-OPERA?datetime=$(date -u -d '-30 min' +%Y-%m-%dT%H:%MZ)%2F$(date -u +%Y-%m-%dT%H:%MZ)&f=CoverageJSON&format=GeoTIFF&standard_name=DBZH" | grep -o 'openradar-24h/[^"]*DBZH.tiff' | tail -1 | sed 's#openradar-24h/##')
          echo "file: $U" >> /tmp/log/deploy.txt
          curl -s -D - -o /tmp/log/body.bin -H "Range: bytes=0-99" -H "Origin: https://vitalicmalachi-ops.github.io" "$URL/$U" >> /tmp/log/deploy.txt 2>&1 || true
          head -c 8 /tmp/log/body.bin | od -c | head -2 >> /tmp/log/deploy.txt
      - name: Salvează jurnalul
        if: always()
        run: |
          cd /tmp/log && rm -f body.bin && git init -q -b worker-log && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Jurnal publicare proxy" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" worker-log
