# Verificare săptămânală a preciziei (luni dimineața) și la cerere. Actualizează accuracy.json din site.
name: Precizie
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Câte zile înapoi
        default: "30"
permissions:
  contents: write
concurrency:
  group: accuracy
jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/accuracy.py accuracy.json ${{ inputs.days || '30' }}
      - name: Publică rezultatul
        run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add accuracy.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Precizie actualizată"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
