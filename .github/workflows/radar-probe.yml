name: Radar probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && mkdir -p out && python3 tools/radar_probe.py out/radar.json
      - name: Salvează pe ramura diag-radar
        run: |
          cd out && git init -q -b diag-radar && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Radar probe" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-radar
