# Calibrare la cerere: ploaia măsurată la stația Chișinău față de prognoza modelelor.
name: Calibrare ploaie
on:
  workflow_dispatch:
    inputs:
      days:
        description: Câte zile înapoi
        default: "90"
permissions:
  contents: write
jobs:
  calib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 tools/calibrate.py out/calib.json ${{ inputs.days }}
      - name: Salvează pe ramura calib
        run: |
          cd out && git init -q -b calib && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Calibrare ${{ inputs.days }} zile" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" calib
