# Verificare la cerere: site-ul publicat, deschis într-un browser real, cu date reale.
name: UI check
on:
  workflow_dispatch:
    inputs:
      lat: { default: "47.0014" }
      lon: { default: "28.8224" }
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p out && LAT=${{ inputs.lat }} LON=${{ inputs.lon }} python3 tools/ui_check.py out/ui.json
      - name: Salvează pe ramura diag-ui
        if: always()
        run: |
          cd out && git init -q -b diag-ui && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "UI check" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-ui
