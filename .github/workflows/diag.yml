# Diagnostic la cerere: prognoza orară a fiecărui model pentru un loc, salvată pe ramura diag.
name: Diagnostic prognoza
on:
  workflow_dispatch:
    inputs:
      place:
        description: Localitate
        default: Ciorescu
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && PLACE="${{ inputs.place }}" python3 tools/diag.py out/diag.json
      - name: Salvează pe ramura diag
        run: |
          cd out && git init -q -b diag && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Diagnostic ${{ inputs.place }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
